<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          color: #f4f6f9;
          font-family: system-ui, sans-serif;
        }
        .wrap {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 96px;
          box-sizing: border-box;
        }
        .left {
          flex: 0 0 46%;
        }
        .right {
          flex: 0 0 40%;
          position: relative;
          height: 60%;
        }
        .badge {
          display: inline-block;
          padding: 8px 22px;
          border: 1px solid rgba(99, 164, 255, 0.5);
          border-radius: 999px;
          color: #63a4ff;
          font-size: 20px;
          letter-spacing: 3px;
          margin-bottom: 26px;
        }
        h1 {
          margin: 0;
          font-size: 64px;
          line-height: 1.18;
          font-weight: 800;
          letter-spacing: 2px;
        }
        .line2 {
          color: #63a4ff;
          margin-top: 10px;
        }
        p.lead {
          margin: 24px 0 0;
          font-size: 30px;
          line-height: 1.5;
          color: #aeb7c2;
        }
        .grid {
          position: absolute;
          inset: 0;
          display: grid;
          grid-template-columns: repeat(3, 92px);
          grid-template-rows: repeat(3, 92px);
          gap: 26px;
          place-content: center;
        }
        .cell {
          width: 92px;
          height: 92px;
          border-radius: 14px;
          background: rgba(99, 164, 255, 0.85);

              <div class="cell"></div>
              <div class="cell"></div>
